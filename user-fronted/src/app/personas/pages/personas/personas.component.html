<div class="row">
  <div class="col-12 col-md-6">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="titleInput" class="form-label">Título:</label>
        <input type="text" class="form-control" id="titleInput" [(ngModel)]="persona.title" name="title">
      </div>

      <div class="mb-3">
        <label for="descriptionInput" class="form-label">Descripción:</label>
        <textarea class="form-control" id="descriptionInput" [(ngModel)]="persona.description" name="description"></textarea>
      </div>

      <div class="mb-3">
        <label for="imageInput" class="form-label">Imagen</label>
        <input type="text" class="form-control" id="imageInput" [(ngModel)]="persona.image" name="image">
      </div>

      <div class="mb-3">
        <label for="categoriesInput" class="form-label">Categorías</label>
        <input type="text" class="form-control" id="categoriesInput" [(ngModel)]="persona.categoria" name="categoria">
      </div>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </div>

  <div class="col-12 col-md-6">
    <div class="container mt-5">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>Imagen</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let persona of personas; let i = index">
            <td>{{ i + 1 }}</td>
            <td>
              <img [src]="persona.image" alt="Imagen" style="width: 50px;">
            </td>
            <td>{{ persona.title }}</td>
            <td>{{ persona.description }}</td>
            <td>
              <span *ngFor="let category of persona.categoria; let j = index">
                {{ category }}<span *ngIf="j < persona.categoria.length - 1">, </span>
              </span>
            </td>
            <td>
              <a href="#" class="btn btn-primary">Ver</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
